# Latest protocol: E2 scratch, E3 sequential transfer, E4 zero-shot.
data:
  root: datasets/ICASSP2025_Paired_Scenes
  source_band: f2
  target_band: f3
  # f2=1.8 GHz, f3=3.5 GHz.
  source_frequency_ghz: 1.8
  target_frequency_ghz: 3.5
  train_fraction: 0.1
  # All positive-distance pixels; no material maps or material-based masking.
  val_fraction: 0.0
  support_fraction: 0.0
model:
  attenuation: wesn
  # fspl_residual: FSPL + learned correction; direct_pl: predict full PL directly.
  prediction_mode: fspl_residual
  num_rays: 8
  num_samples: 16
  hidden_dim: 32
  # Coordinate Fourier scales; carrier frequency is a separate log-frequency feature.
  num_freq: 4
train:
  pretrain_steps: 10000
  target_steps: 10000
  pretrain_lr: 0.001
  target_lr: 0.001
  # Same target optimizer settings for scratch and transfer by default.
  finetune_lr: 0.001
  weight_decay: 0.00001
  gradient_clip_norm: 5.0
  batch_size: 128
  eval_batch_size: 256
  log_every: 100
  max_eval_points: 0
  seed: 42
  device: auto
  num_threads: 2
baseline:
  # Ordinary uniform KNN directly predicts full PL from the shared f3 observations.
  # Analytical FSPL uses no path-loss observations and needs no fit configuration.
  knn:
    k: 5
    batch_size: 4096
baseline_models:
  # Both neural baselines directly predict full PL dB, without an FSPL prior.
  B2_mlp:
    # Inputs: Rx xyz + Tx xyz + log frequency (7); x/y normalized, z in metres.
    hidden_dim: 128
    num_layers: 4
  B3_nerf2:
    hidden_dim: 256
    mlp_num_layers: 8
    mlp_skips: [4]
output_dir: runs/wesn-fspl-residual-minmax-10pct
