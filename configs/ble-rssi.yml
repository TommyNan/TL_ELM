exp_name: ble_rssi
mode: train

### Path settings
data_params:
  type: ble
  data_dir: './datasets/BLE/rssi-dataset-1'
  train_ratio: 0.8
  scale_worldsize: 60  # 60m x 60m, normalize the coordinates to [0, 1]

### System settings
sys_params:
  seed: 42
  device: 'cuda'


### rendering settings
render_params:
  near: 0
  far: 1
  num_points: 64
  scale_worldsize: 60  # 60m x 60m, normalize the coordinates to [0, 1]


### training settings
train_params:
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 5.0e-5
  T_max: 10000
  eta_min: 1e-6
  total_iters: 30000
  load_checkpoint: False
  save_freq: 100
  val_freq: 2500
  report_freq: 100


### network settings
model_params:
  num_layers: 8
  num_hidden: 256
  skips: [4]
  num_freq: {'pts': 10, 'view': 10, 'tx': 10}
  input_dims: {'pts': 3, 'view': 3, 'tx': 3}
  if_embeded: {'pts': True, 'view': True, 'tx': True}
  attn_output_dims: 2
  sig_output_dims: 2

