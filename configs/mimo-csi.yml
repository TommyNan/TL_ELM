exp_name: mimo_csi
mode: train


### Path settings
data_params:
  type: mimo
  data_dir: './datasets/MIMO'
  train_ratio: 0.8
  scale_worldsize: 1

### System settings
sys_params:
  seed: 42
  device: 'cuda'


### rendering settings
render_params:
  near: 0
  far: 5
  num_points: 32


### training settings
train_params:
  batch_size: 64
  lr: 1e-3
  weight_decay: 5e-5
  T_max: 10000
  eta_min: 1e-6
  eps: 1e-8
  total_iters: 70000
  load_checkpoint: False
  save_freq: 100
  val_freq: 2500
  report_freq: 100


### network settings
model_params:
  num_layers: 8
  num_hidden: 256
  skips: [4]
  num_freq: {'pts': 10, 'view': 10, 'tx': 1}
  input_dims: {'pts': 3, 'view': 3, 'tx': 52} # real 26, imag 26 for uplink
  if_embeded: {'pts': True, 'view': True, 'tx': False}
  attn_output_dims: 52
  sig_output_dims: 52